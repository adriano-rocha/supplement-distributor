services:
  db:
    image: postgres:17-alpine
    container_name: supplement-db
    environment:
      POSTGRES_USER: supplement
      POSTGRES_PASSWORD: supplement
      POSTGRES_DB: supplement_dev
    ports:
      - "5436:5432"
    volumes:
      - supplement_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplement -d supplement_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  supplement_pgdata: